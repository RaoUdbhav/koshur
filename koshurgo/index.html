<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2E7D7A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>KoshurGo · کٲشُر لِنگو — Learn Kashmiri the Duolingo Way</title>
  <meta name="description" content="Interactive Kashmiri language learning app with 3 Levels, 3 Paces, gamified exercises, spaced repetition, proverbs and dictionary.">
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- Top Persistent Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="logo-group" onclick="window.koshurGoApp.renderView('path')">
        <span class="logo-icon">🍁</span>
        <div>
          <span class="logo-title">KoshurGo</span>
          <small id="header-level-badge" style="display:block;font-size:10.5px;font-weight:700;color:var(--pine-main);letter-spacing:0.05em;text-transform:uppercase;">Scratch</small>
        </div>
      </div>

      <!-- Gamification Counters -->
      <div class="header-stats-row">
        <span class="stat-pill" id="stat-streak" title="Daily Learning Streak">0 🔥</span>
        <span class="stat-pill" id="stat-hearts" title="Energy / Hearts">5/5 ❤️</span>
        <span class="stat-pill" id="stat-chinar" title="Chinar Leaves Currency">120 🍂</span>
        <span class="stat-pill" id="stat-xp" title="Total Experience Points">0 XP</span>
      </div>

      <!-- Controls & Script Switcher -->
      <div class="header-controls">
        <select id="select-script" class="select-script-dropdown" title="Toggle Script">
          <option value="roman" selected>🔤 Roman (Latin)</option>
          <option value="dev">🕉️ Devanagari (कॉशुर)</option>
          <option value="nastaliq">✍️ Nastaliq (کٲشُر)</option>
        </select>
        <button type="button" id="btn-sound-toggle" class="btn-icon-circle" title="Toggle Sound">🔊</button>
        <button type="button" id="btn-header-auth" class="btn-auth-pill" title="Account & Cloud Sync">👤 Sign In</button>
        <a href="../learnkoshur_site/index.html" class="btn-icon-circle" title="Classic Reference Archive" style="text-decoration:none;">📚</a>
      </div>
    </div>
  </header>

  <!-- Main Dynamic View Container -->
  <main class="app-body" id="main-content-view">
    <!-- Populated by app.js -->
  </main>

  <!-- Auth Modal Dialog -->
  <div id="auth-modal" class="modal-overlay hidden">
    <div class="modal-card animate-scale-up">
      <button type="button" class="modal-close" onclick="window.koshurGoApp.closeAuthModal()">✕</button>
      <div class="modal-header">
        <span class="modal-icon">🍁</span>
        <h3>Sync with KoshurGo Cloud</h3>
        <p>Preserve your streaks, XP, level completions, and Chinar Leaves across all devices.</p>
      </div>

      <div class="modal-body">
        <button type="button" id="btn-google-auth" class="btn-google">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12 0 14.8s.7 5.1 1.9 7.5l3.7-2.9z"/><path fill="#34A853" d="M12 23.5c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16.5C3.7 20.4 7.5 23.5 12 23.5z"/></svg>
          Continue with Google
        </button>

        <div class="auth-divider">
          <span>or with email</span>
        </div>

        <form id="email-auth-form">
          <div class="form-group">
            <label for="auth-email">Email Address</label>
            <input type="email" id="auth-email" required placeholder="you@example.com">
          </div>
          <div class="form-group">
            <label for="auth-password">Password</label>
            <input type="password" id="auth-password" required placeholder="••••••••" minlength="6">
          </div>
          <div class="auth-error-msg" id="auth-error-msg"></div>
          <button type="submit" id="btn-submit-auth" class="btn-duo btn-primary" style="width:100%;">Sign In</button>
        </form>

        <div class="auth-toggle-mode">
          <span id="auth-mode-text">Don't have an account?</span>
          <button type="button" id="btn-toggle-auth-mode">Create Free Account</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation Bar -->
  <nav class="app-nav">
    <button type="button" class="nav-item active" data-route="path">
      <span class="nav-icon">🌲</span>
      <span>Learn</span>
    </button>
    <button type="button" class="nav-item" data-route="dictionary">
      <span class="nav-icon">📖</span>
      <span>Dictionary</span>
    </button>
    <button type="button" class="nav-item" data-route="proverbs">
      <span class="nav-icon">📜</span>
      <span>Proverbs</span>
    </button>
    <button type="button" class="nav-item" data-route="audioLab">
      <span class="nav-icon">🎧</span>
      <span>Audio Lab</span>
    </button>
    <button type="button" class="nav-item" data-route="flashcards">
      <span class="nav-icon">🗂️</span>
      <span>Cards</span>
    </button>
    <button type="button" class="nav-item" data-route="speedMatch">
      <span class="nav-icon">⚡</span>
      <span>Arena</span>
    </button>
    <button type="button" class="nav-item" data-route="bazaar">
      <span class="nav-icon">🍂</span>
      <span>Bazaar</span>
    </button>
    <button type="button" class="nav-item" data-route="profile">
      <span class="nav-icon">👤</span>
      <span>Profile</span>
    </button>
  </nav>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics-compat.js"></script>

  <!-- App Scripts -->
  <script src="./js/audio.js"></script>
  <script src="./js/gamification.js"></script>
  <script src="./js/firebase-auth.js"></script>
  <script src="./js/srs.js"></script>
  <script src="./js/curriculum.js"></script>
  <script src="./js/exercises.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
