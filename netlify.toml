[build]
  publish = "."

[[redirects]]
  from = "/"
  to = "/koshurgo/index.html"
  status = 302
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking & framing
    X-Frame-Options = "DENY"
    
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    
    # Strict Referrer policy for privacy
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Restrict unneeded browser device hardware permissions
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    
    # Enforce HTTPS strictly
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    
    # Content Security Policy with Firebase & Google Auth permissions
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https: https://lh3.googleusercontent.com; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com wss://*.firebaseio.com; frame-src https://*.firebaseapp.com https://*.firebaseio.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';"
